<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="chat-body">
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="me" id="me-panel">
        <div id="me-avatar"></div>
        <span id="me-username"></span>
        <button type="button" id="logout-btn" title="Выйти">⏻</button>
      </div>

      <div class="sidebar-actions">
        <button type="button" id="new-dm-btn">+ Личный чат</button>
        <button type="button" id="new-group-btn">+ Группа</button>
      </div>

      <div class="chat-list" id="chat-list"></div>
    </aside>

    <main class="chat-main">
      <div class="chat-empty" id="chat-empty">
        <p>Выберите чат слева или создайте новый</p>
      </div>

      <div class="chat-view hidden" id="chat-view">
        <header class="chat-header" id="chat-header">
          <button type="button" id="back-btn">←</button>
          <div id="chat-header-info" class="chat-header-info"></div>
        </header>
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer">
          <div class="reply-preview hidden" id="reply-preview">
            <div class="reply-preview-bar"></div>
            <div class="reply-preview-body">
              <div class="reply-preview-author" id="reply-preview-author"></div>
              <div class="reply-preview-text" id="reply-preview-text"></div>
            </div>
            <button type="button" id="reply-preview-cancel" title="Отменить ответ">✕</button>
          </div>
          <div class="composer-row">
            <button type="button" id="emoji-btn" title="Эмодзи">😊</button>
            <div class="emoji-picker hidden" id="emoji-picker"></div>
            <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
            <button type="submit" title="Отправить">➤</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- Модалка: новый личный чат -->
  <div class="modal hidden" id="dm-modal">
    <div class="modal-card">
      <h2>Новый личный чат</h2>
      <input type="text" id="dm-search" placeholder="Введите имя пользователя">
      <div class="user-results" id="dm-results"></div>
      <button type="button" class="modal-close" data-close="dm-modal">Отмена</button>
    </div>
  </div>

  <!-- Модалка: новая группа -->
  <div class="modal hidden" id="group-modal">
    <div class="modal-card">
      <h2>Новая группа</h2>
      <input type="text" id="group-name" placeholder="Название группы">
      <input type="text" id="group-search" placeholder="Добавить участников...">
      <div class="user-results" id="group-results"></div>
      <div class="chips" id="group-chips"></div>
      <button type="button" id="group-create-btn">Создать</button>
      <button type="button" class="modal-close" data-close="group-modal">Отмена</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
